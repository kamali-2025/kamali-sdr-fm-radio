<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamali 2-Player Chess Arena</title>
  <style>
    :root {
      --bg: #161512;
      --panel: #262421;
      --panel-dark: #1d1b18;
      --panel-hover: #36332e;
      --border: #3a3732;
      --text: #e6e3de;
      --muted: #9b968e;
      --light-sq: #f0d9b5;
      --dark-sq: #b58863;
      --sel-sq: rgba(20, 85, 30, 0.52);
      --last-sq: rgba(155, 199, 0, 0.42);
      --check-sq: radial-gradient(ellipse at center, rgba(255, 0, 0, 0.85) 0%, rgba(231, 0, 0, 0.45) 45%, rgba(169, 0, 0, 0) 80%);
      --accent: #3692e7;
      --green: #629924;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Unified Arena Container: Board + Lichess-style Move Window Side by Side */
    .arena {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: stretch;
      justify-content: center;
      max-width: 980px;
      width: 100%;
    }

    /* Left Chessboard */
    .board-container {
      position: relative;
      width: min(560px, 92vw);
      height: min(560px, 92vw);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      user-select: none;
      flex-shrink: 0;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
    }
    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .square.light { background: var(--light-sq); }
    .square.dark { background: var(--dark-sq); }
    .square.last-move::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--last-sq);
      pointer-events: none;
    }
    .square.selected::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--sel-sq);
      pointer-events: none;
    }
    .square.in-check::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--check-sq);
      pointer-events: none;
    }
    .piece {
      position: relative;
      z-index: 2;
      font-size: clamp(32px, 6.2vw, 52px);
      line-height: 1;
      pointer-events: none;
      transition: transform 0.08s ease;
    }
    .piece.white {
      color: #ffffff;
      text-shadow: 0 1px 2px #000, 0 0 2px #000, 0 2px 5px rgba(0,0,0,0.65);
    }
    .piece.black {
      color: #181818;
      text-shadow: 0 1px 1px rgba(255,255,255,0.35), 0 2px 4px rgba(0,0,0,0.4);
    }
    .square:hover .piece {
      transform: scale(1.05);
    }
    .legal-dot {
      position: relative;
      z-index: 3;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(20, 85, 30, 0.45);
      pointer-events: none;
    }
    .legal-ring {
      position: absolute;
      inset: 6%;
      z-index: 3;
      border-radius: 50%;
      border: 5px solid rgba(20, 85, 30, 0.45);
      pointer-events: none;
    }
    .coord-rank {
      position: absolute;
      top: 3px;
      left: 4px;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }
    .coord-file {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }
    .square.light .coord-rank, .square.light .coord-file { color: #b58863; }
    .square.dark .coord-rank, .square.dark .coord-file { color: #f0d9b5; }

    /* Promotion Modal */
    .promo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .promo-overlay.show { display: flex; }
    .promo-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .promo-btn {
      width: 60px;
      height: 60px;
      font-size: 42px;
      background: var(--panel-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .promo-btn:hover { background: var(--panel-hover); border-color: var(--accent); }

    /* Right Lichess-Style Move Window */
    .move-window {
      width: 310px;
      min-height: 560px;
      max-height: 560px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    @media (max-width: 900px) {
      .move-window {
        width: min(560px, 92vw);
        min-height: 360px;
        max-height: 400px;
      }
    }

    /* Player Header / Footer Bars inside Move Window */
    .player-bar {
      padding: 10px 12px;
      background: var(--panel-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .player-bar.bottom {
      border-bottom: none;
      border-top: 1px solid var(--border);
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }
    .status-dot.thinking {
      background: #eab308;
      box-shadow: 0 0 6px #eab308;
    }
    .captured-row {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: -1px;
    }
    .material-diff {
      font-size: 0.78rem;
      color: var(--muted);
      margin-left: 4px;
      font-weight: 700;
    }

    /* VCR Replay Navigation Toolbar (|<<  <  >  >>|) */
    .vcr-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--panel-dark);
      border-bottom: 1px solid var(--border);
    }
    .vcr-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 0;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .vcr-btn:hover:not(:disabled) {
      background: var(--panel-hover);
      color: #fff;
    }
    .vcr-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* Mode & Opponent Strip */
    .mode-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 10px;
      background: #201e1b;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .mode-strip select, .mode-strip button {
      background: var(--panel-dark);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 7px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .mode-strip select:hover, .mode-strip button:hover {
      border-color: var(--accent);
    }

    /* Lichess-style 2-Column Move Table */
    .moves-list {
      flex: 1;
      overflow-y: auto;
      background: var(--panel);
      font-family: "Noto Sans", system-ui, sans-serif;
    }
    .moves-list::-webkit-scrollbar { width: 6px; }
    .moves-list::-webkit-scrollbar-thumb { background: #46423c; border-radius: 3px; }

    .move-row {
      display: grid;
      grid-template-columns: 44px 1fr 1fr;
      align-items: stretch;
      font-size: 0.92rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .move-num {
      background: var(--panel-dark);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      padding: 6px 0;
      user-select: none;
    }
    .move-cell {
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      font-weight: 500;
      transition: background 0.1s;
    }
    .move-cell:hover:not(.empty) {
      background: var(--panel-hover);
    }
    .move-cell.active {
      background: rgba(54, 146, 231, 0.28);
      color: #fff;
      font-weight: 700;
    }
    .move-cell.empty {
      cursor: default;
    }
    .empty-hint {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    /* Status Banner inside Move Window */
    .game-status {
      padding: 8px 12px;
      background: #1a1815;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e6e3de;
    }
    .game-status.alert {
      background: rgba(220, 38, 38, 0.2);
      color: #fca5a5;
    }
    .game-status.win {
      background: rgba(98, 153, 36, 0.25);
      color: #bef264;
    }

    /* Bottom Action Toolbar (Takeback, Flip, Copy PGN, New Game) */
    .action-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--panel-dark);
      border-top: 1px solid var(--border);
    }
    .act-btn {
      background: transparent;
      border: none;
      border-right: 1px solid var(--border);
      color: var(--muted);
      padding: 9px 4px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .act-btn:last-child { border-right: none; }
    .act-btn:hover { background: var(--panel-hover); color: #fff; }
  </style>
</head>
<body>

  <div class="arena">
    <!-- Left: 8x8 Interactive Chessboard -->
    <div class="board-container">
      <div class="board-grid" id="boardGrid"></div>
      <div class="promo-overlay" id="promoOverlay">
        <div class="promo-box" id="promoBox"></div>
      </div>
    </div>

    <!-- Right: Lichess-Style Move Window -->
    <div class="move-window">
      <!-- Top Player (Black / Opponent) -->
      <div class="player-bar">
        <div class="player-info">
          <span class="status-dot" id="topDot"></span>
          <span id="topName">Stockfish Bot (Black)</span>
        </div>
        <div>
          <span class="captured-row" id="topCaptured"></span>
          <span class="material-diff" id="topDiff"></span>
        </div>
      </div>

      <!-- VCR Replay Controls -->
      <div class="vcr-bar">
        <button class="vcr-btn" id="btnFirst" title="First Move">|&lt;&lt;</button>
        <button class="vcr-btn" id="btnPrev" title="Previous Move">&lt;</button>
        <button class="vcr-btn" id="btnNext" title="Next Move">&gt;</button>
        <button class="vcr-btn" id="btnLast" title="Latest Move">&gt;&gt;|</button>
      </div>

      <!-- Opponent / AI Difficulty Strip -->
      <div class="mode-strip">
        <select id="opponentMode" title="Choose Opponent">
          <option value="ai-2" selected>vs AI (Tactical)</option>
          <option value="ai-1">vs AI (Casual)</option>
          <option value="human">2 Players (Local)</option>
        </select>
        <button id="btnSound" title="Toggle Sound">Sound: ON</button>
      </div>

      <!-- 2-Column Algebraic Move List -->
      <div class="moves-list" id="movesList">
        <div class="empty-hint">Make your first move on the board.<br>All White &amp; Black moves appear here.</div>
      </div>

      <!-- Live Game Status -->
      <div class="game-status" id="gameStatus">White to move</div>

      <!-- Bottom Player (White / You) -->
      <div class="player-bar bottom">
        <div class="player-info">
          <span class="status-dot" id="botDot"></span>
          <span id="botName">Alireza (White)</span>
        </div>
        <div>
          <span class="captured-row" id="botCaptured"></span>
          <span class="material-diff" id="botDiff"></span>
        </div>
      </div>

      <!-- Bottom Quick Action Bar -->
      <div class="action-bar">
        <button class="act-btn" id="btnUndo" title="Takeback Move"><span>↩</span><span>Takeback</span></button>
        <button class="act-btn" id="btnFlip" title="Flip Board"><span>⇅</span><span>Flip</span></button>
        <button class="act-btn" id="btnCopy" title="Copy PGN"><span>📋</span><span>Copy PGN</span></button>
        <button class="act-btn" id="btnNew" title="New Game"><span>＋</span><span>New Game</span></button>
      </div>
    </div>
  </div>

  <script>
    const GLYPHS = {
      wK: '♔', wQ: '♕', wR: '♖', wB: '♗', wN: '♘', wP: '♙',
      bK: '♚', bQ: '♛', bR: '♜', bB: '♝', bN: '♞', bP: '♟'
    };
    const VALS = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 0 };
    const FILES = ['a','b','c','d','e','f','g','h'];

    let board = [];
    let turn = 'w';
    let castling = { wK: true, wQ: true, bK: true, bQ: true };
    let epTarget = null; // {r, c}
    let flipped = false;
    let selected = null;
    let legalForSelected = [];
    let history = []; // [{san, from, to, boardSnap, castlingSnap, epSnap, turnAfter, captured}]
    let viewIndex = -1; // -1 = initial position, >=0 = index in history
    let soundOn = true;
    let aiTimer = null;

    const boardGrid = document.getElementById('boardGrid');
    const movesList = document.getElementById('movesList');
    const gameStatus = document.getElementById('gameStatus');
    const promoOverlay = document.getElementById('promoOverlay');
    const promoBox = document.getElementById('promoBox');

    function playTone(freq, dur = 0.08, type = 'triangle') {
      if (!soundOn) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function cloneBoard(b) {
      return b.map(row => row.slice());
    }

    function initGame() {
      if (aiTimer) clearTimeout(aiTimer);
      board = [
        ['bR','bN','bB','bQ','bK','bB','bN','bR'],
        ['bP','bP','bP','bP','bP','bP','bP','bP'],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        ['wP','wP','wP','wP','wP','wP','wP','wP'],
        ['wR','wN','wB','wQ','wK','wB','wN','wR']
      ];
      turn = 'w';
      castling = { wK: true, wQ: true, bK: true, bQ: true };
      epTarget = null;
      selected = null;
      legalForSelected = [];
      history = [];
      viewIndex = -1;
      renderAll();
    }

    function inBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
    function colorOf(p) { return p ? p[0] : null; }
    function typeOf(p) { return p ? p[1] : null; }

    function isSquareAttacked(b, targetR, targetC, byColor) {
      const opp = byColor;
      // Pawns
      const pDir = opp === 'w' ? 1 : -1;
      for (const dc of [-1, 1]) {
        const pr = targetR + pDir, pc = targetC + dc;
        if (inBounds(pr, pc) && b[pr][pc] === opp + 'P') return true;
      }
      // Knights
      const kJumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
      for (const [dr, dc] of kJumps) {
        const nr = targetR + dr, nc = targetC + dc;
        if (inBounds(nr, nc) && b[nr][nc] === opp + 'N') return true;
      }
      // King
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const kr = targetR + dr, kc = targetC + dc;
          if (inBounds(kr, kc) && b[kr][kc] === opp + 'K') return true;
        }
      }
      // Orthogonal (Rook / Queen)
      for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        let r = targetR + dr, c = targetC + dc;
        while (inBounds(r, c)) {
          const p = b[r][c];
          if (p) {
            if (colorOf(p) === opp && (typeOf(p) === 'R' || typeOf(p) === 'Q')) return true;
            break;
          }
          r += dr; c += dc;
        }
      }
      // Diagonal (Bishop / Queen)
      for (const [dr, dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
        let r = targetR + dr, c = targetC + dc;
        while (inBounds(r, c)) {
          const p = b[r][c];
          if (p) {
            if (colorOf(p) === opp && (typeOf(p) === 'B' || typeOf(p) === 'Q')) return true;
            break;
          }
          r += dr; c += dc;
        }
      }
      return false;
    }

    function findKing(b, col) {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (b[r][c] === col + 'K') return { r, c };
        }
      }
      return null;
    }

    function isInCheck(b, col) {
      const k = findKing(b, col);
      if (!k) return false;
      return isSquareAttacked(b, k.r, k.c, col === 'w' ? 'b' : 'w');
    }

    function generatePseudoMoves(b, col, cRights, ep) {
      const moves = [];
      const opp = col === 'w' ? 'b' : 'w';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (!p || colorOf(p) !== col) continue;
          const t = typeOf(p);
          if (t === 'P') {
            const dir = col === 'w' ? -1 : 1;
            const startRow = col === 'w' ? 6 : 1;
            const promoRow = col === 'w' ? 0 : 7;
            if (inBounds(r + dir, c) && !b[r + dir][c]) {
              if (r + dir === promoRow) {
                for (const pr of ['Q','R','B','N']) moves.push({ from:{r,c}, to:{r:r+dir,c}, promo: pr });
              } else {
                moves.push({ from:{r,c}, to:{r:r+dir,c} });
                if (r === startRow && !b[r + 2*dir][c]) {
                  moves.push({ from:{r,c}, to:{r:r+2*dir,c}, doublePawn: true });
                }
              }
            }
            for (const dc of [-1, 1]) {
              const nr = r + dir, nc = c + dc;
              if (!inBounds(nr, nc)) continue;
              if (b[nr][nc] && colorOf(b[nr][nc]) === opp) {
                if (nr === promoRow) {
                  for (const pr of ['Q','R','B','N']) moves.push({ from:{r,c}, to:{r:nr,c:nc}, promo: pr });
                } else {
                  moves.push({ from:{r,c}, to:{r:nr,c:nc} });
                }
              } else if (ep && ep.r === nr && ep.c === nc) {
                moves.push({ from:{r,c}, to:{r:nr,c:nc}, enPassant: true });
              }
            }
          } else if (t === 'N') {
            for (const [dr, dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
              const nr = r + dr, nc = c + dc;
              if (inBounds(nr, nc) && colorOf(b[nr][nc]) !== col) {
                moves.push({ from:{r,c}, to:{r:nr,c:nc} });
              }
            }
          } else if (t === 'K') {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (!dr && !dc) continue;
                const nr = r + dr, nc = c + dc;
                if (inBounds(nr, nc) && colorOf(b[nr][nc]) !== col) {
                  moves.push({ from:{r,c}, to:{r:nr,c:nc} });
                }
              }
            }
            // Castling
            const row = col === 'w' ? 7 : 0;
            if (r === row && c === 4 && !isInCheck(b, col)) {
              if (cRights[col + 'K'] && !b[row][5] && !b[row][6] && b[row][7] === col + 'R') {
                if (!isSquareAttacked(b, row, 5, opp) && !isSquareAttacked(b, row, 6, opp)) {
                  moves.push({ from:{r,c}, to:{r:row,c:6}, castle: 'K' });
                }
              }
              if (cRights[col + 'Q'] && !b[row][3] && !b[row][2] && !b[row][1] && b[row][0] === col + 'R') {
                if (!isSquareAttacked(b, row, 3, opp) && !isSquareAttacked(b, row, 2, opp)) {
                  moves.push({ from:{r,c}, to:{r:row,c:2}, castle: 'Q' });
                }
              }
            }
          } else {
            const dirs = [];
            if (t === 'R' || t === 'Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
            if (t === 'B' || t === 'Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
            for (const [dr, dc] of dirs) {
              let nr = r + dr, nc = c + dc;
              while (inBounds(nr, nc)) {
                if (!b[nr][nc]) {
                  moves.push({ from:{r,c}, to:{r:nr,c:nc} });
                } else {
                  if (colorOf(b[nr][nc]) === opp) moves.push({ from:{r,c}, to:{r:nr,c:nc} });
                  break;
                }
                nr += dr; nc += dc;
              }
            }
          }
        }
      }
      return moves;
    }

    function applyMoveRaw(b, m) {
      const nb = cloneBoard(b);
      const p = nb[m.from.r][m.from.c];
      const col = colorOf(p);
      let captured = nb[m.to.r][m.to.c];

      nb[m.from.r][m.from.c] = null;
      if (m.enPassant) {
        const capR = col === 'w' ? m.to.r + 1 : m.to.r - 1;
        captured = nb[capR][m.to.c];
        nb[capR][m.to.c] = null;
      }
      nb[m.to.r][m.to.c] = m.promo ? col + m.promo : p;

      if (m.castle === 'K') {
        const row = m.from.r;
        nb[row][5] = nb[row][7];
        nb[row][7] = null;
      } else if (m.castle === 'Q') {
        const row = m.from.r;
        nb[row][3] = nb[row][0];
        nb[row][0] = null;
      }
      return { nb, captured };
    }

    function getLegalMoves(b, col, cRights, ep) {
      return generatePseudoMoves(b, col, cRights, ep).filter(m => {
        const { nb } = applyMoveRaw(b, m);
        return !isInCheck(nb, col);
      });
    }

    function toSAN(b, m, allLegal, nextBoard, nextCol, nextLegal) {
      if (m.castle === 'K') return 'O-O';
      if (m.castle === 'Q') return 'O-O-O';
      const p = b[m.from.r][m.from.c];
      const t = typeOf(p);
      const isCap = Boolean(b[m.to.r][m.to.c] || m.enPassant);
      const dest = FILES[m.to.c] + (8 - m.to.r);
      let san = '';

      if (t === 'P') {
        if (isCap) san += FILES[m.from.c] + 'x';
        san += dest;
        if (m.promo) san += '=' + m.promo;
      } else {
        san += t;
        const peers = allLegal.filter(o =>
          o !== m &&
          b[o.from.r][o.from.c] === p &&
          o.to.r === m.to.r &&
          o.to.c === m.to.c
        );
        if (peers.length > 0) {
          const sameFile = peers.some(o => o.from.c === m.from.c);
          const sameRank = peers.some(o => o.from.r === m.from.r);
          if (!sameFile) san += FILES[m.from.c];
          else if (!sameRank) san += (8 - m.from.r);
          else san += FILES[m.from.c] + (8 - m.from.r);
        }
        if (isCap) san += 'x';
        san += dest;
      }

      if (isInCheck(nextBoard, nextCol)) {
        san += nextLegal.length === 0 ? '#' : '+';
      }
      return san;
    }

    function commitMove(m) {
      // If user was browsing earlier history, truncate future moves
      if (viewIndex < history.length - 1) {
        history = history.slice(0, viewIndex + 1);
      }

      const allLegal = getLegalMoves(board, turn, castling, epTarget);
      const p = board[m.from.r][m.from.c];
      const { nb, captured } = applyMoveRaw(board, m);

      const nextCastling = { ...castling };
      if (p === 'wK') { nextCastling.wK = false; nextCastling.wQ = false; }
      if (p === 'bK') { nextCastling.bK = false; nextCastling.bQ = false; }
      if (m.from.r === 7 && m.from.c === 0) nextCastling.wQ = false;
      if (m.from.r === 7 && m.from.c === 7) nextCastling.wK = false;
      if (m.from.r === 0 && m.from.c === 0) nextCastling.bQ = false;
      if (m.from.r === 0 && m.from.c === 7) nextCastling.bK = false;
      if (m.to.r === 7 && m.to.c === 0) nextCastling.wQ = false;
      if (m.to.r === 7 && m.to.c === 7) nextCastling.wK = false;
      if (m.to.r === 0 && m.to.c === 0) nextCastling.bQ = false;
      if (m.to.r === 0 && m.to.c === 7) nextCastling.bK = false;

      const nextEp = m.doublePawn
        ? { r: (m.from.r + m.to.r) / 2, c: m.from.c }
        : null;

      const nextTurn = turn === 'w' ? 'b' : 'w';
      const nextLegal = getLegalMoves(nb, nextTurn, nextCastling, nextEp);
      const san = toSAN(board, m, allLegal, nb, nextTurn, nextLegal);

      board = nb;
      castling = nextCastling;
      epTarget = nextEp;
      turn = nextTurn;
      selected = null;
      legalForSelected = [];

      history.push({
        san,
        from: m.from,
        to: m.to,
        boardSnap: cloneBoard(board),
        castlingSnap: { ...castling },
        epSnap: epTarget ? { ...epTarget } : null,
        turnAfter: turn,
        captured
      });
      viewIndex = history.length - 1;

      if (san.includes('#') || san.includes('+')) playTone(660, 0.14, 'sawtooth');
      else if (captured) playTone(320, 0.1, 'square');
      else playTone(460, 0.06, 'triangle');

      renderAll();
      maybeTriggerAI();
    }

    function maybeTriggerAI() {
      const mode = document.getElementById('opponentMode').value;
      if (mode === 'human') return;
      if (viewIndex !== history.length - 1) return;
      if (turn !== 'b') return;

      const legal = getLegalMoves(board, 'b', castling, epTarget);
      if (legal.length === 0) return;

      document.getElementById('topDot').classList.add('thinking');
      aiTimer = setTimeout(() => {
        document.getElementById('topDot').classList.remove('thinking');
        const choice = pickAIMove(legal, mode === 'ai-2');
        if (choice) commitMove(choice);
      }, 320);
    }

    function pickAIMove(legal, tactical) {
      if (!tactical) {
        return legal[Math.floor(Math.random() * legal.length)];
      }
      let bestScore = -99999;
      let bestMoves = [];
      for (const m of legal) {
        const { nb, captured } = applyMoveRaw(board, m);
        let score = (Math.random() - 0.5) * 0.4;
        if (captured) score += VALS[typeOf(captured)] * 10 - VALS[typeOf(board[m.from.r][m.from.c])];
        if (m.promo) score += VALS[m.promo] * 9;
        if (m.castle) score += 2.5;
        // Center control bonus
        if ((m.to.r === 3 || m.to.r === 4) && (m.to.c === 3 || m.to.c === 4)) score += 1.2;
        // Check / Mate bonus
        if (isInCheck(nb, 'w')) {
          const oppMoves = getLegalMoves(nb, 'w', castling, null);
          score += oppMoves.length === 0 ? 10000 : 3.5;
        }
        // Avoid hanging piece
        if (isSquareAttacked(nb, m.to.r, m.to.c, 'w')) {
          score -= VALS[typeOf(nb[m.to.r][m.to.c])] * 7;
        }
        if (score > bestScore) {
          bestScore = score;
          bestMoves = [m];
        } else if (Math.abs(score - bestScore) < 0.05) {
          bestMoves.push(m);
        }
      }
      return bestMoves[Math.floor(Math.random() * bestMoves.length)];
    }

    function handleSquareClick(r, c) {
      // If viewing past move, snap back to latest move first
      if (viewIndex < history.length - 1) {
        jumpToMove(history.length - 1);
        return;
      }

      const mode = document.getElementById('opponentMode').value;
      if (mode !== 'human' && turn === 'b') return;

      const matching = legalForSelected.filter(m => m.to.r === r && m.to.c === c);
      if (matching.length > 0) {
        if (matching.length > 1 && matching[0].promo) {
          showPromotionDialog(matching);
        } else {
          commitMove(matching[0]);
        }
        return;
      }

      const p = board[r][c];
      if (p && colorOf(p) === turn) {
        selected = { r, c };
        legalForSelected = getLegalMoves(board, turn, castling, epTarget)
          .filter(m => m.from.r === r && m.from.c === c);
      } else {
        selected = null;
        legalForSelected = [];
      }
      renderBoard();
    }

    function showPromotionDialog(promoMoves) {
      promoBox.innerHTML = '';
      const col = turn;
      for (const m of promoMoves) {
        const btn = document.createElement('button');
        btn.className = 'promo-btn';
        btn.textContent = GLYPHS[col + m.promo];
        btn.onclick = () => {
          promoOverlay.classList.remove('show');
          commitMove(m);
        };
        promoBox.appendChild(btn);
      }
      promoOverlay.classList.add('show');
    }

    function jumpToMove(idx) {
      viewIndex = Math.max(-1, Math.min(history.length - 1, idx));
      selected = null;
      legalForSelected = [];
      renderAll();
    }

    function getDisplayedState() {
      if (viewIndex === -1 || history.length === 0) {
        return {
          b: [
            ['bR','bN','bB','bQ','bK','bB','bN','bR'],
            ['bP','bP','bP','bP','bP','bP','bP','bP'],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            ['wP','wP','wP','wP','wP','wP','wP','wP'],
            ['wR','wN','wB','wQ','wK','wB','wN','wR']
          ],
          turnCol: 'w',
          lastMove: null
        };
      }
      const h = history[viewIndex];
      return { b: h.boardSnap, turnCol: h.turnAfter, lastMove: { from: h.from, to: h.to } };
    }

    function renderBoard() {
      const { b, turnCol, lastMove } = getDisplayedState();
      const checkedKing = isInCheck(b, turnCol) ? findKing(b, turnCol) : null;
      boardGrid.innerHTML = '';

      for (let vr = 0; vr < 8; vr++) {
        for (let vc = 0; vc < 8; vc++) {
          const r = flipped ? 7 - vr : vr;
          const c = flipped ? 7 - vc : vc;
          const sq = document.createElement('div');
          sq.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');

          if (lastMove && ((lastMove.from.r === r && lastMove.from.c === c) || (lastMove.to.r === r && lastMove.to.c === c))) {
            sq.classList.add('last-move');
          }
          if (selected && selected.r === r && selected.c === c) {
            sq.classList.add('selected');
          }
          if (checkedKing && checkedKing.r === r && checkedKing.c === c) {
            sq.classList.add('in-check');
          }

          if (vc === 0) {
            const rankLbl = document.createElement('span');
            rankLbl.className = 'coord-rank';
            rankLbl.textContent = 8 - r;
            sq.appendChild(rankLbl);
          }
          if (vr === 7) {
            const fileLbl = document.createElement('span');
            fileLbl.className = 'coord-file';
            fileLbl.textContent = FILES[c];
            sq.appendChild(fileLbl);
          }

          const p = b[r][c];
          if (p) {
            const span = document.createElement('span');
            span.className = 'piece ' + (colorOf(p) === 'w' ? 'white' : 'black');
            span.textContent = GLYPHS[p];
            sq.appendChild(span);
          }

          const isTarget = legalForSelected.some(m => m.to.r === r && m.to.c === c);
          if (isTarget) {
            const marker = document.createElement('div');
            marker.className = p ? 'legal-ring' : 'legal-dot';
            sq.appendChild(marker);
          }

          sq.onclick = () => handleSquareClick(r, c);
          boardGrid.appendChild(sq);
        }
      }
    }

    function renderMovesWindow() {
      movesList.innerHTML = '';
      if (history.length === 0) {
        movesList.innerHTML = '<div class="empty-hint">Make your first move on the board.<br>All White &amp; Black moves appear here.</div>';
      } else {
        for (let i = 0; i < history.length; i += 2) {
          const row = document.createElement('div');
          row.className = 'move-row';

          const num = document.createElement('div');
          num.className = 'move-num';
          num.textContent = (i / 2) + 1;
          row.appendChild(num);

          const wCell = document.createElement('div');
          wCell.className = 'move-cell' + (viewIndex === i ? ' active' : '');
          wCell.textContent = history[i].san;
          wCell.onclick = () => jumpToMove(i);
          row.appendChild(wCell);

          const bCell = document.createElement('div');
          if (history[i + 1]) {
            bCell.className = 'move-cell' + (viewIndex === i + 1 ? ' active' : '');
            bCell.textContent = history[i + 1].san;
            bCell.onclick = () => jumpToMove(i + 1);
          } else {
            bCell.className = 'move-cell empty';
          }
          row.appendChild(bCell);

          movesList.appendChild(row);
        }
        movesList.scrollTop = movesList.scrollHeight;
      }

      // Update VCR button states
      document.getElementById('btnFirst').disabled = viewIndex < 0;
      document.getElementById('btnPrev').disabled = viewIndex < 0;
      document.getElementById('btnNext').disabled = viewIndex >= history.length - 1;
      document.getElementById('btnLast').disabled = viewIndex >= history.length - 1;

      // Update Captured Pieces & Material Advantage
      const activeSlice = viewIndex >= 0 ? history.slice(0, viewIndex + 1) : [];
      const wCaps = [], bCaps = [];
      let wScore = 0, bScore = 0;
      for (const h of activeSlice) {
        if (h.captured) {
          if (colorOf(h.captured) === 'b') {
            wCaps.push(GLYPHS[h.captured]);
            wScore += VALS[typeOf(h.captured)];
          } else {
            bCaps.push(GLYPHS[h.captured]);
            bScore += VALS[typeOf(h.captured)];
          }
        }
      }
      const whiteAtBottom = !flipped;
      document.getElementById('botName').textContent = whiteAtBottom ? 'Alireza (White)' : 'Stockfish Bot (Black)';
      document.getElementById('topName').textContent = whiteAtBottom ? 'Stockfish Bot (Black)' : 'Alireza (White)';

      document.getElementById('botCaptured').textContent = (whiteAtBottom ? wCaps : bCaps).join('');
      document.getElementById('topCaptured').textContent = (whiteAtBottom ? bCaps : wCaps).join('');

      const diff = wScore - bScore;
      document.getElementById('botDiff').textContent = whiteAtBottom ? (diff > 0 ? `+${diff}` : '') : (diff < 0 ? `+${-diff}` : '');
      document.getElementById('topDiff').textContent = whiteAtBottom ? (diff < 0 ? `+${-diff}` : '') : (diff > 0 ? `+${diff}` : '');

      // Update Status Banner
      const legal = getLegalMoves(board, turn, castling, epTarget);
      const check = isInCheck(board, turn);
      gameStatus.className = 'game-status';
      if (viewIndex < history.length - 1) {
        gameStatus.textContent = `Viewing move ${viewIndex + 1} of ${history.length} (click >>| to resume)`;
      } else if (legal.length === 0) {
        if (check) {
          const winner = turn === 'w' ? 'Black' : 'White';
          gameStatus.textContent = `Checkmate! ${winner} wins`;
          gameStatus.classList.add('win');
        } else {
          gameStatus.textContent = 'Draw by Stalemate';
        }
      } else if (check) {
        gameStatus.textContent = `${turn === 'w' ? 'White' : 'Black'} is in Check!`;
        gameStatus.classList.add('alert');
      } else {
        gameStatus.textContent = `${turn === 'w' ? 'White' : 'Black'} to move`;
      }
    }

    function renderAll() {
      renderBoard();
      renderMovesWindow();
    }

    // Toolbar & Keyboard Controls
    document.getElementById('btnFirst').onclick = () => jumpToMove(-1);
    document.getElementById('btnPrev').onclick = () => jumpToMove(viewIndex - 1);
    document.getElementById('btnNext').onclick = () => jumpToMove(viewIndex + 1);
    document.getElementById('btnLast').onclick = () => jumpToMove(history.length - 1);

    document.getElementById('btnFlip').onclick = () => {
      flipped = !flipped;
      renderAll();
    };

    document.getElementById('btnUndo').onclick = () => {
      if (history.length === 0) return;
      if (aiTimer) clearTimeout(aiTimer);
      const mode = document.getElementById('opponentMode').value;
      const stepsBack = (mode !== 'human' && turn === 'w' && history.length >= 2) ? 2 : 1;
      const targetIdx = history.length - 1 - stepsBack;
      if (targetIdx < 0) {
        initGame();
      } else {
        history = history.slice(0, targetIdx + 1);
        const snap = history[targetIdx];
        board = cloneBoard(snap.boardSnap);
        castling = { ...snap.castlingSnap };
        epTarget = snap.epSnap ? { ...snap.epSnap } : null;
        turn = snap.turnAfter;
        viewIndex = targetIdx;
        selected = null;
        legalForSelected = [];
        renderAll();
      }
    };

    document.getElementById('btnCopy').onclick = () => {
      const pairs = [];
      for (let i = 0; i < history.length; i += 2) {
        const w = history[i].san;
        const b = history[i + 1] ? ' ' + history[i + 1].san : '';
        pairs.push(`${(i/2)+1}. ${w}${b}`);
      }
      navigator.clipboard?.writeText(pairs.join(' '));
      const btn = document.getElementById('btnCopy');
      btn.lastElementChild.textContent = 'Copied!';
      setTimeout(() => btn.lastElementChild.textContent = 'Copy PGN', 1400);
    };

    document.getElementById('btnNew').onclick = () => initGame();
    document.getElementById('btnSound').onclick = () => {
      soundOn = !soundOn;
      document.getElementById('btnSound').textContent = soundOn ? 'Sound: ON' : 'Sound: OFF';
    };
    document.getElementById('opponentMode').onchange = () => maybeTriggerAI();

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') jumpToMove(viewIndex - 1);
      if (e.key === 'ArrowRight') jumpToMove(viewIndex + 1);
    });

    initGame();
  </script>
</body>
</html>
